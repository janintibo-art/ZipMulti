publish_to: "none"
version: 0.3.0+3

environment:
  sdk: ">=3.10.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  archive: ^4.2.0
  crypto: ^3.0.6
  file_picker: ^12.1.1
  path: ^1.9.1
  receive_sharing_intent: ^1.9.0
  shared_preferences: ^2.5.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
