name: zip_multi
description: Création de volumes ZIP standards et fractionnement avancé multi-plateforme.
publish_to: "none"
version: 0.3.0+5

environment:
  sdk: ">=3.10.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  archive: ^4.2.0
  crypto: ^3.0.6
  file_picker: ^12.1.1
  path: ^1.9.1
  path_provider: ^2.1.5
  receive_sharing_intent: ^1.9.0
  share_plus: ^13.3.0
  shared_preferences: ^2.5.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
