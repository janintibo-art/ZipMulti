name: zip_multi
description: Création de volumes ZIP standards et fractionnement avancé multi-plateforme.
publish_to: "none"
version: 0.3.0+3

environment:
  sdk: ">=3.10.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  archive: ^4.2.0
  crypto: ^3.0.6
  file_picker: ^12.1.1
  path: ^1.9.1
  receive_sharing_intent: ^1.9.0
  shared_preferences: ^2.5.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

# Icône de l'application, générée à la compilation par `dart run flutter_launcher_icons`.
# Les images vivent dans docs/ car elles servent aussi au site web GitHub Pages.
flutter_launcher_icons:
  android: "launcher_icon"
  ios: false
  image_path: "docs/icon.png"
  min_sdk_android: 24
  adaptive_icon_background: "#0B0D1A"
  adaptive_icon_foreground: "docs/icon.png"
  windows:
    generate: true
    image_path: "docs/icon.png"
    icon_size: 256
