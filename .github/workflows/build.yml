name: Build ZipMulti Android + Windows

on:
  workflow_dispatch:
  push:
    branches: ["main", "master"]
    tags: ["v*"]

permissions:
  contents: read

jobs:
  android:
    name: Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter stable
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android platform files
        run: |
          flutter create . --platforms=android --project-name zip_multi --org com.zipmulti
          # flutter create recree test/widget_test.dart, qui reference MyApp et
          # fait echouer flutter analyze / flutter test sur ce projet.
          rm -f test/widget_test.dart

      - name: Enable Android ZIP open/share intents
        run: python3 tool/patch_android_manifest.py

      - name: Dependencies
        run: flutter pub get

      - name: Application icon
        run: dart run flutter_launcher_icons

      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: Tests
        run: flutter test

      - name: Build APK release
        run: flutter build apk --release

      - name: Collect APK
        run: |
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk dist/ZipMulti.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ZipMulti-Android-APK
          path: dist/ZipMulti.apk
          if-no-files-found: error

  windows:
    name: Windows EXE
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter stable
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Windows platform files
        shell: bash
        run: |
          flutter create . --platforms=windows --project-name zip_multi --org com.zipmulti
          rm -f test/widget_test.dart

      - name: Dependencies
        run: flutter pub get

      - name: Application icon
        run: dart run flutter_launcher_icons

      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: Tests
        run: flutter test

      - name: Build Windows release
        run: flutter build windows --release

      - name: Package portable application
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath dist/ZipMulti-Windows-Portable.zip

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Build Windows installer EXE
        shell: pwsh
        run: '& "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer\zipmulti.iss'

      - name: Collect installer
        shell: pwsh
        run: Copy-Item installer/output/ZipMulti-Setup.exe dist/ZipMulti-Setup.exe

      - name: Upload Windows files
        uses: actions/upload-artifact@v4
        with:
          name: ZipMulti-Windows
          path: dist/*
          if-no-files-found: error

  release:
    name: Publier la release
    needs: [android, windows]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Recuperer les fichiers compiles
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Regrouper
        run: |
          mkdir -p release
          find artifacts -type f -exec cp {} release/ \;
          ls -lh release

      - name: Publier la release
        uses: softprops/action-gh-release@v2
        with:
          files: release/*
          generate_release_notes: true
          fail_on_unmatched_files: true
